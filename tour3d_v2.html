<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>경기북부병무지청 2차 실사 3D v2.2 (1:1,000 DXF + 네이버 내부 거리뷰 + 카카오 로드뷰)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    * { box-sizing: border-box; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0f172a; }
    #canvas-container { position: fixed; inset: 0; width: 100vw; height: 100vh; }
    .glass {
      background: rgba(15, 23, 42, 0.86);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(148, 163, 184, 0.25);
    }
    .cam-btn.active {
      background: #2563eb;
      color: #ffffff;
      border-color: #60a5fa;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- 좌측 상단 정보 카드 -->
  <div class="fixed top-4 left-4 z-20 flex flex-col gap-2 w-80 max-w-[92vw] pointer-events-none">
    <div class="glass rounded-2xl px-4 py-3 shadow-2xl pointer-events-auto">
      <div class="flex flex-wrap items-center gap-1.5 mb-1">
        <span class="px-2 py-0.5 rounded bg-blue-600 text-white text-[10px] font-extrabold">2차 작업 · 로드뷰 실측 반영</span>
        <span class="px-2 py-0.5 rounded bg-emerald-500/20 border border-emerald-400/40 text-emerald-300 text-[10px] font-bold">v2.2 · 동쪽 주차장 풀구획·외벽 완전 밀폐</span>
      </div>
      <h1 class="text-sm font-extrabold text-white">경기북부병무지청 2차 실사 3D 모델</h1>
      <p class="text-[11px] text-slate-300 mt-0.5 leading-snug">
        1차 DXF 뼈대 위에 <strong>네이버 청사 내부 거리뷰</strong>(남·동·북면, 경사로·옹벽·계단, 민원실, 3층 구름다리)와 <strong>카카오 로드뷰</strong>를 그대로 반영했습니다.
      </p>
    </div>

    <div id="view-card" class="glass rounded-2xl px-4 py-2.5 shadow-xl pointer-events-auto">
      <div id="view-title" class="text-xs font-extrabold text-sky-300">1. 정문~경사로·옹벽·청사 전체뷰</div>
      <p id="view-desc" class="text-[11px] text-slate-300 mt-0.5 leading-relaxed">
        정문 진입 직후 좌측은 상부 체크광장·보행 경사로, 우측 차도는 옹벽을 따라 하부(B1 민원실·동쪽 순환주차장)로 바로 내려가는 실제 현장 구조를 그대로 구현했습니다.
      </p>
    </div>
  </div>

  <!-- 우측 상단 컨트롤 + 확대/축소 버튼 -->
  <div class="fixed top-4 right-4 z-20 flex flex-col items-end gap-2">
    <div class="flex flex-wrap items-center justify-end gap-1.5">
      <button id="btn-day" onclick="window.setLight('day')" class="glass px-3 py-1.5 rounded-xl text-xs font-bold text-white bg-blue-600/80 border-blue-400/50 cursor-pointer">☀️ 맑은 낮</button>
      <button id="btn-sunset" onclick="window.setLight('sunset')" class="glass px-3 py-1.5 rounded-xl text-xs font-bold text-slate-300 cursor-pointer hover:bg-slate-800">🌅 노을</button>
      <button id="btn-dxf" onclick="window.toggleDxf()" class="glass px-3 py-1.5 rounded-xl text-xs font-bold text-cyan-300 border-cyan-400/50 cursor-pointer hover:bg-slate-800">📐 DXF선 OFF</button>
      <a href="tour3d_cad.html" class="glass px-3 py-1.5 rounded-xl text-xs font-bold text-amber-300 hover:bg-slate-800 transition">1차 CAD 완성본</a>
      <a href="index.html" class="glass px-3 py-1.5 rounded-xl text-xs font-bold text-slate-200 hover:bg-slate-800 transition">◀ 비주얼노벨</a>
    </div>

    <div class="glass rounded-2xl p-1.5 shadow-2xl flex flex-col items-center gap-1.5 mt-1">
      <button type="button" onmousedown="window.startZoom(-1)" onmouseup="window.stopZoom()" onmouseleave="window.stopZoom()" ontouchstart="window.startZoom(-1)" ontouchend="window.stopZoom()" onclick="window.stepZoom(-1)" class="w-10 h-10 rounded-xl bg-slate-800/90 hover:bg-blue-600 active:scale-95 text-white font-black text-xl border border-slate-600/80 transition flex items-center justify-center cursor-pointer" title="확대">+</button>
      <span class="text-[10px] font-bold text-slate-300 select-none">확대/축소</span>
      <button type="button" onmousedown="window.startZoom(1)" onmouseup="window.stopZoom()" onmouseleave="window.stopZoom()" ontouchstart="window.startZoom(1)" ontouchend="window.stopZoom()" onclick="window.stepZoom(1)" class="w-10 h-10 rounded-xl bg-slate-800/90 hover:bg-blue-600 active:scale-95 text-white font-black text-xl border border-slate-600/80 transition flex items-center justify-center cursor-pointer" title="축소">−</button>
    </div>
  </div>

  <!-- 하단 카메라 프리셋 (네이버 거리뷰 핵심 구도 6종 + 도보 체험) -->
  <div class="fixed bottom-4 left-1/2 -translate-x-1/2 z-20 w-[96vw] max-w-5xl">
    <div class="glass rounded-2xl p-2 shadow-2xl flex flex-wrap items-center justify-center gap-1.5">
      <button onclick="window.setView('overview')" id="c-overview" class="cam-btn active px-3 py-2 rounded-xl text-xs font-bold text-slate-200 bg-slate-800/80 hover:bg-slate-700 border border-slate-700 cursor-pointer">1. 정문~전체뷰</button>
      <button onclick="window.setView('rampSplit')" id="c-rampSplit" class="cam-btn px-3 py-2 rounded-xl text-xs font-bold text-slate-200 bg-slate-800/80 hover:bg-slate-700 border border-slate-700 cursor-pointer">2. 경사로·옹벽·검사장 입구</button>
      <button onclick="window.setView('southB1')" id="c-southB1" class="cam-btn px-3 py-2 rounded-xl text-xs font-bold text-slate-200 bg-slate-800/80 hover:bg-slate-700 border border-slate-700 cursor-pointer">3. 남면 4층·민원실·계단</button>
      <button onclick="window.setView('eastSkybridge')" id="c-eastSkybridge" class="cam-btn px-3 py-2 rounded-xl text-xs font-bold text-slate-200 bg-slate-800/80 hover:bg-slate-700 border border-slate-700 cursor-pointer">4. 동쪽 주차장·구름다리·본관</button>
      <button onclick="window.setView('mainGate')" id="c-mainGate" class="cam-btn px-3 py-2 rounded-xl text-xs font-bold text-slate-200 bg-slate-800/80 hover:bg-slate-700 border border-slate-700 cursor-pointer">5. 전좌로 정문·원통로비</button>
      <button onclick="window.setView('aerial')" id="c-aerial" class="cam-btn px-3 py-2 rounded-xl text-xs font-bold text-slate-200 bg-slate-800/80 hover:bg-slate-700 border border-slate-700 cursor-pointer">6. 전체 조감도</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    // =========================================================================
    // [2차 작업 v2.0] 국토지리정보원 1:1,000 DXF 실측 좌표 + 네이버 내부 거리뷰 360° 실사 반영
    // 핵심 실측 단차 (네이버 거리뷰 step_45, step_52, step_95 확인):
    //   - 상부 광장/본관/병역판정검사장 2F 입구 레벨: y = 0.0m
    //   - 하부 동쪽 순환주차장 / 별관 남쪽 고객지원센터(민원실) 1F 레벨: y = -3.8m (1개 층 높이 단차!)
    //   - 정문 진입 차도: 정문(x=-24, y=0.0m) ➔ 별관 남쪽(x=+14, y=-3.8m)까지 완만히 하강,
    //     그 동쪽(x=+14 ~ +85)은 완전히 평평한 하부 주차장·민원실 레벨(y = -3.8m)!
    // =========================================================================
    const LOW_Y = -3.8; // 하부 민원실·동쪽 순환 주차장 레벨 (실제 1개 층 단차)

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0xdbeafe, 260, 620);

    const camera = new THREE.PerspectiveCamera(44, window.innerWidth / window.innerHeight, 0.25, 760);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.04;
    container.appendChild(renderer.domElement);

    const maxAniso = renderer.capabilities.getMaxAnisotropy();
    const pmremGen = new THREE.PMREMGenerator(renderer);
    scene.environment = pmremGen.fromScene(new RoomEnvironment(), 0.04).texture;
    scene.environmentIntensity = 0.45;

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.maxPolarAngle = Math.PI / 2 - 0.012;
    controls.minDistance = 5;
    controls.maxDistance = 240;

    // 맑은 하늘 그라디언트 돔
    const skyCanvas = document.createElement('canvas'); skyCanvas.width = 16; skyCanvas.height = 512;
    const skyCtx = skyCanvas.getContext('2d');
    const skyTex = new THREE.CanvasTexture(skyCanvas); skyTex.colorSpace = THREE.SRGBColorSpace;
    scene.add(new THREE.Mesh(new THREE.SphereGeometry(560, 32, 24), new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide, fog: false })));
    function setSky(top, mid, hor) {
      const g = skyCtx.createLinearGradient(0, 0, 0, 512);
      g.addColorStop(0, top); g.addColorStop(0.45, mid); g.addColorStop(0.56, hor); g.addColorStop(1, hor);
      skyCtx.fillStyle = g; skyCtx.fillRect(0, 0, 16, 512); skyTex.needsUpdate = true;
    }
    setSky('#1d4ed8', '#60a5fa', '#e0f2fe');

    const hemi = new THREE.HemisphereLight(0xe0f2fe, 0x475569, 0.72); scene.add(hemi);
    const sun = new THREE.DirectionalLight(0xfffdf5, 2.35);
    sun.position.set(-60, 74, 68); sun.castShadow = true;
    sun.shadow.mapSize.set(4096, 4096);
    sun.shadow.camera.left = -115; sun.shadow.camera.right = 115;
    sun.shadow.camera.top = 115; sun.shadow.camera.bottom = -115;
    sun.shadow.bias = -0.0003; sun.shadow.normalBias = 0.04;
    scene.add(sun);
    const fill = new THREE.DirectionalLight(0x93c5fd, 0.38); fill.position.set(70, 35, -55); scene.add(fill);

    // =========================================================================
    // PBR 텍스처 & 재질 (네이버 거리뷰 실측 색상 반영)
    // =========================================================================
    function prepTex(tex, rx = 1, ry = 1) {
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(rx, ry);
      tex.anisotropy = maxAniso; tex.colorSpace = THREE.SRGBColorSpace; return tex;
    }
    function makeGridStoneTex(base = '#e4e7ec', line = '#a6b0bc', cols = 8, rows = 8, rx = 0.16, ry = 0.16) {
      const c = document.createElement('canvas'); c.width = 512; c.height = 512;
      const g = c.getContext('2d'); g.fillStyle = base; g.fillRect(0, 0, 512, 512);
      const cw = 512 / cols, ch = 512 / rows;
      for (let r = 0; r < rows; r++) for (let col = 0; col < cols; col++) {
        const v = (Math.random() - 0.5) * 10;
        g.fillStyle = v > 0 ? `rgba(255,255,255,${v/255})` : `rgba(0,0,0,${-v/255})`;
        g.fillRect(col * cw, r * ch, cw, ch);
      }
      g.strokeStyle = line; g.lineWidth = 2;
      for (let i = 0; i <= cols; i++) { g.beginPath(); g.moveTo(i * cw, 0); g.lineTo(i * cw, 512); g.stroke(); }
      for (let j = 0; j <= rows; j++) { g.beginPath(); g.moveTo(0, j * ch); g.lineTo(512, j * ch); g.stroke(); }
      return prepTex(new THREE.CanvasTexture(c), rx, ry);
    }
    function makeGroovedRetainTex() {
      // 네이버 거리뷰 step_45_shot_1, step_52_shot_2: 세로 홈이 파인 콘크리트 블록 옹벽!
      const c = document.createElement('canvas'); c.width = 512; c.height = 512;
      const g = c.getContext('2d'); g.fillStyle = '#a3a8ad'; g.fillRect(0, 0, 512, 512);
      for (let x = 0; x < 512; x += 16) {
        g.fillStyle = (x % 32 === 0) ? '#888e94' : '#b2b7bc';
        g.fillRect(x, 0, 6, 512);
      }
      g.strokeStyle = '#6b7280'; g.lineWidth = 2;
      for (let y = 0; y <= 512; y += 64) { g.beginPath(); g.moveTo(0, y); g.lineTo(512, y); g.stroke(); }
      return prepTex(new THREE.CanvasTexture(c), 6, 1.5);
    }
    function makeRedWhiteCheckerTex(repX = 4, repY = 4) {
      // 네이버 거리뷰 step_52_shot_2, step_57_shot_1: 붉은 벽돌 + 흰색 체크 보도블록 광장!
      const c = document.createElement('canvas'); c.width = 512; c.height = 512;
      const g = c.getContext('2d');
      const n = 8, s = 512 / n;
      for (let r = 0; r < n; r++) for (let col = 0; col < n; col++) {
        g.fillStyle = (r + col) % 2 === 0 ? '#d8c9c4' : '#a87066';
        g.fillRect(col * s, r * s, s, s);
      }
      return prepTex(new THREE.CanvasTexture(c), repX, repY);
    }
    function makeAsphaltTex(rep = 14) {
      const c = document.createElement('canvas'); c.width = 512; c.height = 512;
      const g = c.getContext('2d'); g.fillStyle = '#58606a'; g.fillRect(0, 0, 512, 512);
      for (let i = 0; i < 6000; i++) {
        const v = 70 + Math.floor(Math.random() * 38);
        g.fillStyle = `rgb(${v},${v+2},${v+4})`; g.fillRect(Math.random() * 512, Math.random() * 512, 2, 2);
      }
      return prepTex(new THREE.CanvasTexture(c), rep, rep);
    }
    function makeBrickTex() {
      const c = document.createElement('canvas'); c.width = 512; c.height = 512;
      const g = c.getContext('2d'); g.fillStyle = '#9ca3af'; g.fillRect(0, 0, 512, 512);
      const rows = 16, cols = 8, bh = 512 / rows, bw = 512 / cols;
      const pal = ['#b67858', '#a86b4c', '#c38564', '#9e6244', '#bc7e5d'];
      for (let r = 0; r < rows; r++) for (let col = -1; col <= cols; col++) {
        const off = (r % 2) * (bw / 2);
        g.fillStyle = pal[(r * 5 + col * 3 + 12) % pal.length];
        g.fillRect(col * bw + off + 2, r * bh + 2, bw - 4, bh - 4);
      }
      return prepTex(new THREE.CanvasTexture(c), 4, 1.5);
    }
    function makeSignTex({ w = 512, h = 128, bg = '#ffffff', border = null, lines = [], vertical = false, circle = false }) {
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const g = c.getContext('2d');
      if (circle) {
        g.clearRect(0, 0, w, h); g.beginPath(); g.arc(w/2, h/2, Math.min(w, h)/2 - 4, 0, Math.PI * 2);
        g.fillStyle = bg; g.fill();
        if (border) { g.strokeStyle = border.color; g.lineWidth = border.width || 10; g.stroke(); }
      } else if (bg !== 'transparent') {
        g.fillStyle = bg; g.fillRect(0, 0, w, h);
        if (border) { g.strokeStyle = border.color; g.lineWidth = border.width || 6; g.strokeRect(border.width/2, border.width/2, w - border.width, h - border.width); }
      }
      g.textAlign = 'center'; g.textBaseline = 'middle';
      if (vertical) {
        const chars = lines[0].text.split(''); const step = (h - 30) / chars.length;
        g.font = lines[0].font; g.fillStyle = lines[0].color;
        chars.forEach((ch, idx) => g.fillText(ch, w / 2, 18 + step * (idx + 0.5)));
      } else {
        lines.forEach(l => { g.font = l.font; g.fillStyle = l.color; g.fillText(l.text, l.x ?? w / 2, l.y ?? h / 2); });
      }
      const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = maxAniso;
      return tex;
    }

    const panelMat = new THREE.MeshStandardMaterial({ map: makeGridStoneTex('#e7e9ee', '#adb5c0', 8, 8, 0.16, 0.16), roughness: 0.68 });
    const retainBlockMat = new THREE.MeshStandardMaterial({ map: makeGroovedRetainTex(), roughness: 0.88 });
    const concreteMat = new THREE.MeshStandardMaterial({ color: 0xcbd2da, roughness: 0.82 });
    const greenRoofMat = new THREE.MeshStandardMaterial({ color: 0x2e6f5e, roughness: 0.82 });
    const blueRoofMat = new THREE.MeshStandardMaterial({ color: 0x2563eb, roughness: 0.55, metalness: 0.2 });
    const solarMat = new THREE.MeshPhysicalMaterial({ color: 0x172554, roughness: 0.14, metalness: 0.65, clearcoat: 0.9, envMapIntensity: 1.8 });
    const yellowLobbyMat = new THREE.MeshStandardMaterial({ color: 0xd9c264, roughness: 0.38, metalness: 0.25 });
    const brickMat = new THREE.MeshStandardMaterial({ map: makeBrickTex(), roughness: 0.86 });
    const glassMat = new THREE.MeshPhysicalMaterial({ color: 0x1f5f6b, roughness: 0.07, metalness: 0.22, clearcoat: 1.0, envMapIntensity: 2.0 });
    const mintSpandrelMat = new THREE.MeshPhysicalMaterial({ color: 0x99d1c6, roughness: 0.15, metalness: 0.15, clearcoat: 0.85, envMapIntensity: 1.4 });
    const frameMat = new THREE.MeshStandardMaterial({ color: 0x28323e, roughness: 0.45, metalness: 0.55 });
    const whiteMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.48 });
    const yellowMat = new THREE.MeshStandardMaterial({ color: 0xfacc15, roughness: 0.55 });
    const asphaltMat = new THREE.MeshStandardMaterial({ map: makeAsphaltTex(16), roughness: 0.90 });
    const checkerPlazaMat = new THREE.MeshStandardMaterial({ map: makeRedWhiteCheckerTex(6, 5), roughness: 0.85 });
    const sidewalkMat = new THREE.MeshStandardMaterial({ map: makeGridStoneTex('#d6dadf', '#a7b0ba', 10, 10, 4, 4), roughness: 0.82 });
    const redWalkMat = new THREE.MeshStandardMaterial({ map: makeGridStoneTex('#9c7464', '#6d4e42', 8, 8, 2, 22), roughness: 0.88 });
    const grassMat = new THREE.MeshStandardMaterial({ color: 0x4f783e, roughness: 0.94 });
    const hedgeMat = new THREE.MeshStandardMaterial({ color: 0x2a5c30, roughness: 0.92 });
    const railMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.88, roughness: 0.20 });
    const graniteMat = new THREE.MeshStandardMaterial({ map: makeGridStoneTex('#cbc9c4', '#868a8f', 6, 4, 2, 1), roughness: 0.80 });
    const handicapMat = new THREE.MeshStandardMaterial({ color: 0x2563eb, roughness: 0.65 });
    const woodMat = new THREE.MeshStandardMaterial({ color: 0x7c4a26, roughness: 0.82 });

    function addBox(w, h, d, mat, x, y, z, parent = scene, shadow = true) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
      m.position.set(x, y, z); m.castShadow = shadow; m.receiveShadow = true;
      parent.add(m); return m;
    }

    function extrudeDxfPoly(ptsXZ, baseY, height, mat, parent = scene, shadow = true) {
      const shape = new THREE.Shape();
      ptsXZ.forEach(([x, z], i) => { if (i === 0) shape.moveTo(x, -z); else shape.lineTo(x, -z); });
      shape.closePath();
      const geo = new THREE.ExtrudeGeometry(shape, { depth: height, bevelEnabled: false });
      geo.rotateX(-Math.PI / 2);
      const m = new THREE.Mesh(geo, mat);
      m.position.y = baseY; m.castShadow = shadow; m.receiveShadow = true;
      parent.add(m); return m;
    }

    // 주차 차량 & 주차열 헬퍼
    function addCar(x, y, z, rotY = 0, hex = 0xe2e8f0) {
      const g = new THREE.Group(); g.position.set(x, y, z); g.rotation.y = rotY;
      const bm = new THREE.MeshPhysicalMaterial({ color: hex, roughness: 0.22, metalness: 0.45, clearcoat: 1.0 });
      const gm = new THREE.MeshPhysicalMaterial({ color: 0x0f172a, roughness: 0.08, clearcoat: 1.0 });
      const wm = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.9 });
      addBox(1.82, 0.58, 4.2, bm, 0, 0.52, 0, g);
      addBox(1.58, 0.52, 2.2, bm, 0, 1.0, -0.15, g);
      addBox(1.62, 0.38, 1.9, gm, 0, 1.0, -0.15, g, false);
      [[-0.86, 0.26, 1.25], [0.86, 0.26, 1.25], [-0.86, 0.26, -1.25], [0.86, 0.26, -1.25]].forEach(([wx, wy, wz]) => {

      eastSkybridge: { pos: new THREE.Vector3(68, 0.5, -2),   target: new THREE.Vector3(32, 5.5, 4),  t: '4. 동쪽 주차장 · 3층 통유리 구름다리 · 본관 동쪽 날개', d: '별관 동면 [경기북부 병무청] 간판과 4×4 계단 커튼월, 1층 적벽돌, 3층 7-bay 통유리 구름다리, 본관 동측 커튼월과 정자(정자)를 한눈에 봅니다.' },
      mainGate:      { pos: new THREE.Vector3(-44, 2.4, 46),  target: new THREE.Vector3(-6, 5.5, 4),  t: '5. 전좌로 정문 · 본관 노란 원통 로비', d: '전좌로에서 정문 3개 화강석 기둥·자바라 철문, 본관 남서쪽 360° 노란 원통 로비, 민트그린 스팬드럴 유리창, 별관 서면을 바라봅니다.' },
      aerial:        { pos: new THREE.Vector3(10, 128, 72),   target: new THREE.Vector3(14, 0, -4),   t: '6. 전체 조감도 (1:1,000 DXF 실측 기반)', d: '우측 상단 [📐 DXF선 ON/OFF]로 1차 공식 CAD 도면선과 100% 일치하는지 바로 대조해 볼 수 있습니다.' }
    };
    let camAnim = null;
    window.setView = (k) => {
      const v = VIEWS[k]; if (!v) return;
      camAnim = { sp: camera.position.clone(), ep: v.pos.clone(), st: controls.target.clone(), et: v.target.clone(), t: 0 };
      document.querySelectorAll('.cam-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('c-' + k)?.classList.add('active');
      document.getElementById('view-title').innerText = v.t;
      document.getElementById('view-desc').innerText = v.d;
    };
    window.setLight = (m) => {
      const d = document.getElementById('btn-day'), s = document.getElementById('btn-sunset');
      if (m === 'sunset') {
        setSky('#1e3a8a', '#ea580c', '#fdba74'); scene.fog.color.setHex(0xfdba74);
        sun.color.setHex(0xff9248); sun.intensity = 2.0; sun.position.set(-85, 25, 32);
        s.classList.add('bg-amber-600/80', 'text-white'); d.classList.remove('bg-blue-600/80', 'text-white');
      } else {
        setSky('#1d4ed8', '#60a5fa', '#e0f2fe'); scene.fog.color.setHex(0xdbeafe);
        sun.color.setHex(0xfffdf5); sun.intensity = 2.35; sun.position.set(-60, 74, 68);
        d.classList.add('bg-blue-600/80', 'text-white'); s.classList.remove('bg-amber-600/80', 'text-white');
      }
    };

    // 확대/축소 버튼 & WASD
    let zoomDir = 0; const zOff = new THREE.Vector3();
    function applyZoom(f) {
      camAnim = null; zOff.subVectors(camera.position, controls.target);
      zOff.setLength(Math.max(controls.minDistance, Math.min(controls.maxDistance, zOff.length() * f)));
      camera.position.copy(controls.target).add(zOff);
    }
    window.stepZoom = d => applyZoom(d < 0 ? 0.84 : 1.19);
    window.startZoom = d => { zoomDir = d; }; window.stopZoom = () => { zoomDir = 0; };
    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if (['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) camAnim = null;
      if (e.key === '+' || e.key === '=') applyZoom(0.88);
      if (e.key === '-' || e.key === '_') applyZoom(1.14);
    });
    window.addEventListener('keyup', e => { keys[e.code] = false; });
    controls.addEventListener('start', () => { camAnim = null; });

    const clock = new THREE.Clock(), fwd = new THREE.Vector3(), rgt = new THREE.Vector3();
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      if (zoomDir !== 0) applyZoom(zoomDir < 0 ? Math.pow(0.45, dt) : Math.pow(2.2, dt));
      if (camAnim) {
        camAnim.t = Math.min(1, camAnim.t + dt / 1.0);
        const e = camAnim.t < 0.5 ? 2 * camAnim.t * camAnim.t : 1 - Math.pow(-2 * camAnim.t + 2, 2) / 2;
        camera.position.lerpVectors(camAnim.sp, camAnim.ep, e);
        controls.target.lerpVectors(camAnim.st, camAnim.et, e);
        if (camAnim.t >= 1) camAnim = null;
      }
      const sp = 16 * dt;
      camera.getWorldDirection(fwd); fwd.y = 0; fwd.normalize();
      rgt.crossVectors(fwd, camera.up).normalize();
      if (keys['KeyW'] || keys['ArrowUp'])    { camera.position.addScaledVector(fwd, sp);  controls.target.addScaledVector(fwd, sp); }
      if (keys['KeyS'] || keys['ArrowDown'])  { camera.position.addScaledVector(fwd, -sp); controls.target.addScaledVector(fwd, -sp); }
      if (keys['KeyA'] || keys['ArrowLeft'])  { camera.position.addScaledVector(rgt, -sp); controls.target.addScaledVector(rgt, -sp); }
      if (keys['KeyD'] || keys['ArrowRight']) { camera.position.addScaledVector(rgt, sp);  controls.target.addScaledVector(rgt, sp); }
      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    camera.position.copy(VIEWS.overview.pos);
    controls.target.copy(VIEWS.overview.target);
    buildPhase2().then(animate);
  </script>
</body>
